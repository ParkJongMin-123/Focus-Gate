<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Focus Gate는 앱을 열기 전 잠깐 멈추고, 내 시간을 의식적으로 선택하도록 도와줘요." />
    <title>Focus Gate — Focus your way</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="header-band"><header class="container site-header">
      <a class="brand" href="./" aria-label="Focus Gate 홈"><img class="brand-icon" src="assets/app-icon.png" alt="" /><span>Focus Gate</span></a>
      <a class="button" href="#features">시작하기</a>
    </header></div>
    <main>
      <section class="hero-band" aria-labelledby="hero-title"><div class="container hero">
        <div>
          <h1 id="hero-title">PAUSE.<br />CHOOSE.</h1>
        </div>
        <div class="phone"><img class="app-shot" src="assets/pause.jpg" alt="Focus Gate Pause 화면" /></div>
      </div></section>
      <section id="features" class="features" aria-label="Focus Gate 기능 소개">
        <article class="feature">
          <div class="phone"><img class="app-shot" src="assets/pause.jpg" alt="Focus Gate Pause 화면" /></div>
          <div class="feature-copy"><h2>열기 전,<br />잠깐 멈춰요</h2><p>선택한 앱을 열면 계속 사용할지 고르기 전에 잠시 멈춰요.</p></div>
        </article>
        <article class="feature reversed">
          <div class="phone"><img class="app-shot" src="assets/repause.jpg" alt="Focus Gate RePause 화면" /></div>
          <div class="feature-copy"><h2>시간이 끝나면,<br />다시 선택해요</h2><p>더 사용할까요? 잠시 멈춘 뒤 계속할 수 있어요.</p></div>
        </article>
        <article class="feature">
          <div class="phone"><img class="app-shot" src="assets/stats.jpg" alt="Focus Gate 통계 화면" /></div>
          <div class="feature-copy"><h2>기간별<br />사용시간 비교</h2><p>통계에서 사용 시간과 실행 취소를 확인할 수 있어요.</p></div>
        </article>
      </section>
    </main>
    <footer class="site-footer"><div class="container footer-row"><strong>Focus Gate</strong><a href="privacy-policy/">개인정보처리방침</a></div></footer>
  </body>
</html>
